<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>牛马上班 · 桌面宠物</title>
  <link rel="stylesheet" href="./pet.css" />
</head>
<body>
  <main class="pet" aria-label="桌面收入宠物" data-phase="unconfigured">
    <section id="pet-bubble" class="bubble" aria-label="浮窗内容">
      <div class="bubble-header"><span id="pet-phase">尚未设置</span><div class="actions">
        <button id="pet-settings" type="button" aria-label="设置显示内容" title="设置显示内容">⚙</button>
        <button id="pet-privacy" type="button" aria-label="隐藏金额" title="隐藏金额">◉</button>
        <button id="pet-close" type="button" aria-label="隐藏宠物" title="隐藏宠物，可从托盘重新打开">×</button>
      </div></div>
      <button id="pet-details" class="details" type="button" title="打开收入与设置">
        <span class="caption">当前已赚</span><strong id="pet-amount">—</strong>
      </button>
      <p id="pet-message" role="status">先设置工资和作息吧</p>
      <time id="pet-clock" hidden></time>
      <p id="pet-custom-text" hidden></p>
    </section>
    <div class="mascot" data-tauri-drag-region title="拖动小牛，移动浮窗">
      <svg viewBox="0 0 160 140" aria-label="陪你上班的小牛" role="img" data-tauri-drag-region>
        <ellipse class="ground" cx="80" cy="130" rx="43" ry="5" />
        <g class="cow">
          <path class="tail" d="M119 103q24-16 20-32" />
          <path class="horn" d="M49 40Q31 26 40 13q3 16 18 18M105 34q16-6 16-21 13 16-5 28" />
          <path class="ear" d="M46 43Q14 27 21 48q3 14 26 10M115 43q31-16 24 5-3 14-26 10" />
          <path class="body" d="M52 78q-15 13-12 38l3 11h23l5-12h18l5 12h23l3-11q3-25-13-38" />
          <path class="hoof" d="M43 123h23v6H43zM94 123h23v6H94z" />
          <rect class="head" x="38" y="27" width="84" height="77" rx="33" />
          <path class="patch" d="M90 28q29-2 30 31-28 7-30-31" />
          <g class="eyes"><ellipse cx="59" cy="62" rx="4" ry="6" /><ellipse cx="101" cy="62" rx="4" ry="6" /></g>
          <ellipse class="cheek" cx="49" cy="76" rx="8" ry="5" /><ellipse class="cheek" cx="111" cy="76" rx="8" ry="5" />
          <rect class="muzzle" x="53" y="75" width="54" height="25" rx="12" />
          <circle class="nostril" cx="67" cy="85" r="2.5" /><circle class="nostril" cx="93" cy="85" r="2.5" />
          <path class="smile" d="M74 92q6 4 12 0" />
          <path class="leaf" d="M76 29q-14-6-11-17 16 0 16 15 3-20 18-19 1 17-18 21" />
          <path class="collar" d="M52 101q28 10 56 0" /><circle class="bell" cx="80" cy="108" r="6" />
        </g>
      </svg>
    </div>
    <span class="drag-hint">拖动小牛 · 点击金额看详情</span>
    <button id="pet-only-settings" class="only-settings" type="button" aria-label="设置显示内容" title="设置显示内容">⚙</button>
  </main>
  <form id="pet-preferences" class="pet-preferences" aria-label="浮窗显示设置" hidden>
    <h1>显示内容</h1>
    <fieldset id="pet-item-fields"><legend>自由勾选组合</legend></fieldset>
    <label for="pet-text-input">自定义文字（选填，最多40字）</label>
    <textarea id="pet-text-input" maxlength="40" rows="2" placeholder="例如：今天也要好好生活"></textarea>
    <p class="preferences-note">全部取消且文字留空时，只显示宠物。收入项同步遵守金额隐藏设置。</p>
    <p id="pet-preferences-error" role="alert" hidden></p>
    <div class="preferences-actions"><button id="pet-cancel-preferences" type="button">取消</button><button type="submit">保存</button></div>
  </form>
  <script type="module" src="./pet.js"></script>
</body>
</html>
