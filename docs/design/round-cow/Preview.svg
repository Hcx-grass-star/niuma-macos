    <path d="M12 10C10.5 8.5 10.5 6.5 11.2 5.2M24 10C25.5 8.5 25.5 6.5 24.8 5.2"/>
    <path d="M8.3 14C6.6 12.3 4.2 12 2.5 12.7C3 15.3 4.9 17 7.8 16.7M27.7 14C29.4 12.3 31.8 12 33.5 12.7C33 15.3 31.1 17 28.2 16.7"/>
    <path d="M18 9.3C11.2 9.3 7.7 13 7.7 19.1C7.7 26.3 11.4 29.3 18 29.3C24.6 29.3 28.3 26.3 28.3 19.1C28.3 13 24.8 9.3 18 9.3Z"/>
    <path d="M12.2 24.2C14.4 26.2 21.6 26.2 23.8 24.2" stroke-width="1.8"/>
  </g>
  <circle cx="13.3" cy="17.9" r="1.3"/><circle cx="22.7" cy="17.9" r="1.3"/>
  <ellipse cx="15" cy="23" rx=".9" ry="1.1"/><ellipse cx="21" cy="23" rx=".9" ry="1.1"/>
</symbol></defs>
